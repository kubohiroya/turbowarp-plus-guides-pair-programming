<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360"><g font-family="Noto Sans JP,Hiragino Kaku Gothic ProN,Arial,sans-serif"><rect width="480" height="360" fill="#edf3fb"/><text x="24" y="38" font-size="20" font-weight="700" fill="#263454">プラとモコのペアプログラミング教室</text><text x="24" y="64" font-size="12" font-weight="500" fill="#24314b">相談して一つ直し、役割を交代しよう</text><text x="24" y="85" font-size="12" font-weight="500" fill="#24314b">好きな単元をクリック。順番に学ぶと約10〜12分。</text><text x="24" y="315" font-size="12" font-weight="500" fill="#24314b">操作は省略OK。クイズは何度でも選び直せます。</text><text x="24" y="338" font-size="11" font-weight="500" fill="#24314b">Scratchの知識を出発点に、プラとモコがご案内します。</text></g></svg>
