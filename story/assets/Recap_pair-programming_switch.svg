<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360"><g font-family="Noto Sans JP,Hiragino Kaku Gothic ProN,Arial,sans-serif"><rect width="480" height="360" fill="#edf3fb"/><path d="M0 265 Q240 205 480 265 V360 H0" fill="#dce9ef"/><rect x="16" y="14" width="448" height="151" rx="18" fill="white"/><rect x="16" y="14" width="7" height="151" rx="3" fill="#6366df"/><text x="34" y="39" font-size="11" font-weight="600" fill="#666b88">プラとモコのペアプログラミング教室</text><text x="34" y="68" font-size="21" font-weight="700" fill="#263454">この単元の持ち帰り</text><text x="34" y="92" font-size="13.5" font-weight="500" fill="#24314b">作業の切れ目で交代する</text><text x="34" y="112" font-size="13.5" font-weight="500" fill="#24314b">変更と確認結果を言葉にする</text><text x="34" y="132" font-size="13.5" font-weight="500" fill="#24314b">次に調べることをそろえる</text><text x="70" y="337" font-size="11" font-weight="700" fill="#454fbe">プラ</text><text x="355" y="337" font-size="11" font-weight="700" fill="#178c77">モコ</text><text x="132" y="352" font-size="10" font-weight="500" fill="#626f86">Space：次へ　・　緑の旗：最初から</text></g></svg>
