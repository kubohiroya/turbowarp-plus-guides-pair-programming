  switch_intro:
    - stage: Board_pair-programming_switch
    - Unit1.hide: {}
    - Unit2.hide: {}
    - Unit3.hide: {}
    - Unit4.hide: {}
    - Unit5.hide: {}
    - Unit6.hide: {}
    - AnswerA.hide: {}
    - AnswerB.hide: {}
    - NextUnit.hide: {}
    - Menu.hide: {}
    - Pura.show:
        skin: PuraIdle
        x: -135
        y: -110
        scale: 9.5
    - Moko.show:
        skin: MokoIdle
        x: 135
        y: -110
        scale: 9.5
    - Moko.say:
        text: そろそろ交代？ はい、どうぞ！ たぶん何か変えたので見てね。
        seconds: 6.2
        styles:
          - lesson
    - Pura.say:
        text: 受け取る前に、今の状態を三つだけ教えて。何を変えた？ 何を確認した？ 次は何をする？
        seconds: 8.2
        styles:
          - lesson
    - Moko.say:
        text: 個数を6にした。Gで出現を数えた。次は、星が重なるなら間隔を見直す。
        seconds: 6.9
        styles:
          - lesson
    - Pura.say:
        text: 助かる。ではプラがドライバー、モコがナビゲーター。修正は試運転まで終わったから、ここで交代しやすいね。
        seconds: 9.6
        styles:
          - lesson
    - Moko.say:
        text: 今度はぼくが「間隔を触ると個数も変わりそう？」って確認する係。
        seconds: 6.4
        styles:
          - lesson
    - Pura.say:
        text: もし調査の途中なら、どこまで分かったかを伝える。「まだ再現できていない」も大事な情報だよ。
        seconds: 8.7
        styles:
          - lesson
    - Moko.say:
        text: 時間で交代してもいい？
        seconds: 4.5
        styles:
          - lesson
    - Pura.say:
        text: うん。試運転の後、問題の区切り、決めた時間のどれでもいい。片方がずっと操作していたら交代を提案しよう。
        seconds: 9.6
        styles:
          - lesson
    - Moko.say:
        text: 渡すのはマウスだけじゃない。現在地も一緒に渡すんだ。
        seconds: 5.6
        styles:
          - lesson
