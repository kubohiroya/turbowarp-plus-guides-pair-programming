    - Pura.show:
        skin: PuraIdle
        x: -135
        y: -110
        scale: 9.5
    - Moko.show:
        skin: MokoIdle
        x: 135
        y: -110
        scale: 9.5
    - Moko.say:
        text: ペアプログラミングだ！ プラは左半分、ぼくは右半分。マウスを二つつなごう！
        seconds: 7.4
        styles:
          - lesson
    - Pura.say:
        text: 今日は一つの作品の、一つの作業を一緒に進めよう。マウスを動かすのは一人ずつで十分だよ。
        seconds: 8.3
        styles:
          - lesson
    - Moko.say:
        text: じゃあぼくがドライバー。プラは助手席でおやつを食べる係？
        seconds: 5.9
        styles:
          - lesson
    - Pura.say:
        text: ナビゲーターは行き先を考える係。「星が出る処理はどこ？」「どの動きで直ったと分かる？」と一緒に確かめるよ。
        seconds: 9.9
        styles:
          - lesson
    - Moko.say:
        text: ドライバーは言われた通りにクリックするだけ？
        seconds: 4.9
        styles:
          - lesson
    - Pura.say:
        text: 操作の意図を共有して、わからないところは聞き返す。どう直すかは二人で決めるんだ。
        seconds: 7.9
        styles:
          - lesson
    - Moko.say:
        text: 今日の作品は、Gキーで星を並べる「星あつめ」。まず、そのコードを探します！
        seconds: 7.4
        styles:
          - lesson
    - Pura.say:
        text: いいね。「ペア練習」スプライトの黄色い帽子から、星を並べるブロックまでたどろう。
        seconds: 7.9
        styles:
          - lesson
    - Moko.say:
        text: その前に、画面のどこで名前を探せるか、ガイドで一緒に確かめよう。
        seconds: 6.6
        styles:
          - lesson
    - broadcastMessageAndWait: lesson:pair-programming_roles
    - goto: roles_quiz
