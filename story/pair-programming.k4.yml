  talk-edit_intro:
    - stage: Board_pair-programming_talk-edit
    - Unit1.hide: {}
    - Unit2.hide: {}
    - Unit3.hide: {}
    - Unit4.hide: {}
    - Unit5.hide: {}
    - Unit6.hide: {}
    - AnswerA.hide: {}
    - AnswerB.hide: {}
    - NextUnit.hide: {}
    - Menu.hide: {}
    - Pura.show:
        skin: PuraIdle
        x: -135
        y: -110
        scale: 9.5
    - Moko.show:
        skin: MokoIdle
        x: 135
        y: -110
        scale: 9.5
    - Moko.say:
        text: ドライバーのモコです。星を増やすために、えーと、間隔を60から600にします！
        seconds: 7.7
        styles:
          - lesson
    - Pura.say:
        text: 個数と間隔、どっちを変えると六つ出ると思う？ 呼び出しブロックの定義を見てみよう。
        seconds: 8
        styles:
          - lesson
    - Moko.say:
        text: 「星を並べる」の最初は個数。二つ目は間隔。口に出したら、何を変えるかはっきりしたよ。
        seconds: 8.2
        styles:
          - lesson
    - Pura.say:
        text: そう。その調子で今からする操作を短く話すと、相手は間違えそうなところをその場で聞ける。
        seconds: 8.3
        styles:
          - lesson
    - Moko.say:
        text: では個数を6に、間隔は60のまま。プラ、確認してね。
        seconds: 5.6
        styles:
          - lesson
    - Pura.say:
        text: 変えたらGキーを一度押す。星が出るたびに数えて、6個で止まるか、消える動きは同じか見よう。
        seconds: 8.7
        styles:
          - lesson
    - Moko.say:
        text: 無言で全部直してから発表すると、なぜ変えたか忘れても相手は教えてくれないね。
        seconds: 7.5
        styles:
          - lesson
    - Pura.say:
        text: 一つ変えたときに一緒に見る方が早いこともある。今はブロックの数値を一つだけ変えてみよう。
        seconds: 8.5
        styles:
          - lesson
    - Moko.say:
        text: 「ペア練習」を開くよ。遊ぶ人はドライバー役、画面のプラはナビゲーター役！
        seconds: 7.2
        styles:
          - lesson
    - broadcastMessageAndWait: lesson:pair-programming_talk-edit
    - goto: talk-edit_quiz
