  goal_intro:
    - stage: Board_pair-programming_goal
    - Unit1.hide: {}
    - Unit2.hide: {}
    - Unit3.hide: {}
    - Unit4.hide: {}
    - Unit5.hide: {}
    - Unit6.hide: {}
    - AnswerA.hide: {}
    - AnswerB.hide: {}
    - NextUnit.hide: {}
    - Menu.hide: {}
    - Pura.show:
        skin: PuraIdle
        x: -135
        y: -110
        scale: 9.5
    - Moko.show:
        skin: MokoIdle
        x: 135
        y: -110
        scale: 9.5
    - Moko.say:
        text: ぼくの目標は、星をきれいにして、音もつけて、ゲームをだいたい百倍楽しくすること！
        seconds: 7.9
        styles:
          - lesson
    - Pura.say:
        text: やりたいことが増えたね。今回は「Gキーを1回押すと、出てくる星が5個から6個になる」に絞ろう。
        seconds: 9
        styles:
          - lesson
    - Moko.say:
        text: 六つ目の星に光る音は？
        seconds: 4.5
        styles:
          - lesson
    - Pura.say:
        text: 次の候補に書いておこう。目標を小さくすると、いま何を変えたかと、何が原因かを説明しやすい。
        seconds: 8.7
        styles:
          - lesson
    - Moko.say:
        text: じゃあ最初にGキーを1回。出てきた星を数えてみる。
        seconds: 5.4
        styles:
          - lesson
    - Pura.say:
        text: うん。変更前に数えれば、いまの動きと期待との差を二人で共有できる。練習データの初期値は5だよ。
        seconds: 9
        styles:
          - lesson
    - Moko.say:
        text: 直ったかどうかは「おおむね増えた」で判定！
        seconds: 4.8
        styles:
          - lesson
    - Pura.say:
        text: 6個になったか、間隔や消える動きは期待通りかを言葉で確かめよう。終わる条件がそろったら編集を始める。
        seconds: 9.5
        styles:
          - lesson
    - Moko.say:
        text: 一回でできる目標と、あとで試すアイデアを分けるんだね。
        seconds: 5.8
        styles:
          - lesson
    - goto: goal_quiz
