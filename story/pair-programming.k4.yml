    - Moko.say:
        text: 完成！ 結果は「モコがすごい」で記録しておくね。
        seconds: 5.3
        styles:
          - lesson
    - Pura.say:
        text: 次に読む人が再現できるようにしよう。「星の個数を5から6へ変えた。Gを1回押して6個を確認」なら分かるよ。
        seconds: 9.9
        styles:
          - lesson
    - Moko.say:
        text: まだ話したいことがあった。音は次回。それも別にメモする。
        seconds: 5.9
        styles:
          - lesson
    - Pura.say:
        text: そう。最後に二人で作品を動かして、保存する人と保存先を確認しよう。
        seconds: 6.7
        styles:
          - lesson
    - Moko.say:
        text: 画面共有でもできる？ こっちは文字が小さくて、個数の欄が分からないんだけど。
        seconds: 7.5
        styles:
          - lesson
    - Pura.say:
        text: 映している画面を見やすくして、対象のスプライト名とブロック名を言う。遠隔操作がなくても、口頭で確認や交代はできる。
        seconds: 10.6
        styles:
          - lesson
    - Moko.say:
        text: 交代するときは相手が同じ版を開いたか確認するね。二つのコピーを同時に勝手に直さない。
        seconds: 8.2
        styles:
          - lesson
    - Pura.say:
        text: うん。共有先がある場合は、差分を一緒に確認してから送る。認証画面や個人情報が出るときは画面共有を一時停止しよう。
        seconds: 10.4
        styles:
          - lesson
    - Moko.say:
        text: 前の版と比べられるし、次のペアにも続きが渡せる。星も仕事も、並びが見えたね！
        seconds: 7.5
        styles:
          - lesson
