    - Moko.show:
        skin: MokoIdle
        x: 135
        y: -110
        scale: 9.5
    - Moko.say:
        text: 星が窮屈だ。全部ちょっと左へ寄せよう。ぼくは左派！
        seconds: 5.4
        styles:
          - lesson
    - Pura.say:
        text: ぼくは間隔を少し狭める案。どちらでも6個が収まるか、まずそれぞれの予想を話そう。
        seconds: 7.9
        styles:
          - lesson
    - Moko.say:
        text: 開始位置を左へ動かすと、最後の星も左にずれる。左端からはみ出ないか気になるな。
        seconds: 7.7
        styles:
          - lesson
    - Pura.say:
        text: 間隔を狭くすると、最初の星は同じ位置。最後は内側へ寄るけど、星が重ならないか見よう。
        seconds: 8.2
        styles:
          - lesson
    - Moko.say:
        text: 両方同時に直せば二人の意見が通る！
        seconds: 4.5
        styles:
          - lesson
    - Pura.say:
        text: 何が効いたか分からなくなるよ。まず間隔だけ60から50にしてGで試す。次に値を戻し、開始位置だけ試す。
        seconds: 9.6
        styles:
          - lesson
    - Moko.say:
        text: 比べるものは、星が6個出るか、重ならないか、画面に収まるか。
        seconds: 6.2
        styles:
          - lesson
    - Pura.say:
        text: その観察をもとに、今回は必要な変更を選ぶ。合意できないときは、調べたいことを一つ残して次へ進んでもいい。
        seconds: 9.8
        styles:
          - lesson
    - Moko.say:
        text: 議論に勝つより、何が起きたか同じ画面で見られる方が助かるね。
        seconds: 6.2
        styles:
          - lesson
